name: 故障报告
description: 报告可复现的问题，请勿包含密钥或私人聊天记录。
body:
  - type: input
    id: versions
    attributes:
      label: 环境与版本
      description: 系统、Node、DSH 和 dsh-bot 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
